<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Knowledge Graph Builder</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/KnowledgeGraphBuilder.Shared/kgb.css" />
    <link rel="icon" href="data:,">
    <style>
        body { margin: 0; font-family: Roboto, "Segoe UI", system-ui, sans-serif; }
        .kgb-boot { height: 100vh; display: grid; place-items: center; color: #5f5f70; font-size: 14px; }
        #blazor-error-ui { display: none; position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 16px; background: #fdecea; color: #7d1a14; z-index: 1000; }
        #blazor-error-ui .reload { color: inherit; margin-left: 8px; }
        #blazor-error-ui .dismiss { cursor: pointer; float: right; }
    </style>
</head>

<body>

    <div id="app"><div class="kgb-boot">Loading Knowledge Graph Builder…</div></div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/KnowledgeGraphBuilder.Shared/kgb.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>

</body>

</html>
